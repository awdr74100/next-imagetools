name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Platform-independent gates.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm before setup-node, so the node cache can resolve the pnpm store.
      # Version is read from the root package.json "packageManager" field.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The fixture's typecheck runs `next typegen`, which loads next.config.ts, which imports
      # the package from dist — so typecheck needs a build even though lint and format don't.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm lint:english
      - run: pnpm format:check
      - run: pnpm knip

  # Turbopack's file watching, persistent caches and the loaders' cache writes all go through the
  # filesystem, which is exactly what differs across platforms: concurrent renames into the cache
  # failed with EPERM only on Windows, and macOS's filesystem is case-insensitive by default. So
  # every suite runs on all three. Each bundler is a job of its own (NIT_BUNDLER), so supporting
  # both doesn't double the wait, and the job name says which one broke.
  test:
    name: test (${{ matrix.os }}, ${{ matrix.bundler }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      # One platform failing must not cancel the others — which one broke is the finding.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        bundler: [turbopack, webpack]
    env:
      NIT_BUNDLER: ${{ matrix.bundler }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The rendering-mode suite drives a real browser (CSR pages have no images in their HTML).
      # GitHub's runner images already carry Chromium's system libraries, so only the headless
      # shell is downloaded, and cached: `--with-deps` would go through apt, whose mirrors were
      # unreachable from Ubuntu runners for an afternoon (Nuxt, Vite and Next.js skip it too).
      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --only-shell chromium

      # Build first: the suites load the package from dist and refuse to run without it.
      - run: pnpm build
      - run: pnpm test

  # The oldest Next.js and Node.js the package supports — the lower bounds of its `next` peer
  # range and its `engines` — so a feature from a later release can't slip in unnoticed (16.2
  # added the rule `type` and query conditions the package is built on). Ubuntu only: the matrix
  # above covers platforms, and 16.2's standalone output links directories as file symlinks,
  # which Windows can't follow.
  test-min:
    name: test-min (${{ matrix.bundler }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bundler: [turbopack, webpack]
    env:
      NIT_BUNDLER: ${{ matrix.bundler }}
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: node scripts/pin-min-next.mjs
      # The lockfile is for the current Next.js, so this install re-resolves it.
      - run: pnpm install --no-frozen-lockfile
      # Only the headless shell, cached, as in the test job.
      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.playwright
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      - run: pnpm exec playwright install --only-shell chromium
      # The build tools need a current Node.js; what users run is the built package.
      - run: pnpm build

      - id: min-node
        run: echo "version=$(node -p "require('./package.json').engines.node.replace(/^>=\s*/, '')")" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ steps.min-node.outputs.version }}
      - run: node --version
      - run: pnpm test
